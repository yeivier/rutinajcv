\u2022 A1, A2, A3 \xB7 B1, B2\u2026: ejercicios encadenados de un bloque. La LETRA identifica el bloque (superserie, triserie o serie gigante) y el N\xDAMERO el orden dentro de \xE9l. A1 \u2192 A2 \u2192 A3 se hacen seguidos, sin descanso entre ellos.
\u2022 Ronda: una vuelta completa al bloque (hacer A1, A2 y A3 una vez). El bloque se repite tantas rondas como diga el plan; el descanso llega reci\xE9n al terminar cada ronda.
\u2022 SS = superserie (2 ejercicios) \xB7 TRI = triserie (3) \xB7 GIG = serie gigante (4 o m\xE1s).
\u2022 Tipos de serie: APR = aproximaci\xF3n \xB7 EF = efectiva \xB7 TOP = top set \xB7 B-O = back-off \xB7 DROP = drop set \xB7 R-P = rest-pause \xB7 AMR = AMRAP \xB7 CLU = cluster \xB7 VMA = iso final \xB7 ISO = iso media + reps \xB7 PFI = pre-fatiga iso \xB7 DNS = serie de densidad.
\u2022 RIR = repeticiones en reserva \xB7 RPE = esfuerzo percibido \xB7 \u2212% = porcentaje de bajada de carga de esa serie.`,ej:"\xABB2 \xB7 Ronda 2/3 \xB7 DROP\xBB = segundo ejercicio del bloque B, vas en la segunda de tres rondas, y esa serie es un drop set."},{id:"topset",term:"Top set",def:"La serie m\xE1s pesada del ejercicio en el d\xEDa: una sola serie con el peso m\xE1ximo planificado, normalmente cerca del fallo (RIR 0\u20132). Sirve para empujar la progresi\xF3n de fuerza y como referencia para calcular las series siguientes.",ej:"Top set: 1 \xD7 6\u20138 @ RIR 1 con 100 kg, y desde ah\xED se calculan los back-offs."},{id:"backoff",term:"Back-off set",def:"Series que se hacen despu\xE9s del top set bajando el peso (t\xEDpicamente entre 10 % y 20 % menos) para acumular volumen de calidad con menos fatiga y mejor t\xE9cnica.",ej:"Top set 100 kg \u2192 back-offs 2 \xD7 8\u201310 con 85 kg (\u221215 %). FORJA te sugiere el peso autom\xE1ticamente."},{id:"dropset",term:"Drop set",def:"Al terminar la serie cerca del fallo, bajas el peso de inmediato (20\u201330 % menos) y sigues repitiendo sin descanso. Puede tener una o varias \xABca\xEDdas\xBB. Genera mucho est\xEDmulo y mucha fatiga: se usa con moderaci\xF3n, normalmente en la \xFAltima serie de ejercicios de aislamiento.",ej:"Elevaciones laterales: 12 reps con 10 kg \u2192 sin descansar, 10 reps con 7 kg \u2192 8 reps con 5 kg."},{id:"restpause",term:"Rest-pause",def:"Haces la serie hasta cerca del fallo, descansas 10\u201320 segundos y, con el mismo peso, sacas un mini-bloque m\xE1s de repeticiones. Se puede repetir 1\u20132 veces. Permite acumular repeticiones efectivas en poco tiempo.",ej:"12 reps \u2192 15 s de pausa \u2192 4 reps \u2192 15 s \u2192 3 reps, todo con el mismo peso."},{id:"amrap",term:"AMRAP",def:"\xABAs Many Reps As Possible\xBB: haces todas las repeticiones posibles con t\xE9cnica correcta (seg\xFAn el RIR indicado). Sirve para medir progreso y ajustar cargas.",ej:"\xDAltima serie AMRAP @ RIR 1: anota cu\xE1ntas salieron; si superas el rango, la pr\xF3xima semana sube el peso."},{id:"warmup",term:"Serie de calentamiento (Warm-up set, WRM)",def:"Series ligeras previas a las series de trabajo para preparar articulaciones, activar la musculatura y practicar la t\xE9cnica sin generar fatiga. No cuentan como volumen efectivo.",ej:"Antes de un top set de 100 kg: 8 reps con 40 kg, 5 con 60 kg, 3 con 80 kg."},{id:"efectiva",term:"Serie de trabajo (Working set, WRK)",def:"Serie de trabajo real, hecha lo bastante cerca del fallo (RIR 0\u20134) como para estimular hipertrofia. Es la unidad con la que se cuenta el volumen semanal por grupo muscular.",ej:"3 series de trabajo de 8\u201310 @ RIR 2 en remo = 3 series que suman al volumen de espalda."},{id:"superset",term:"Superserie",def:"Dos ejercicios realizados uno inmediatamente despu\xE9s del otro, descansando reci\xE9n al terminar el segundo. Ahorra tiempo y funciona mejor con m\xFAsculos antagonistas o que no compiten entre s\xED.",ej:"Curl de b\xEDceps + extensi\xF3n de tr\xEDceps en polea, descanso de 90 s al completar ambos."},{id:"tempo",term:"Tempo",def:"Velocidad de cada fase de la repetici\xF3n escrita en 4 n\xFAmeros: exc\xE9ntrica \u2013 pausa abajo \u2013 conc\xE9ntrica \u2013 pausa arriba (en segundos). Controlar la bajada suele ser lo m\xE1s relevante para hipertrofia.",ej:"Tempo 3-1-1-0: bajas en 3 s, pausa de 1 s, subes en 1 s, sin pausa arriba."},{id:"fallo",term:"Fallo muscular / fallo t\xE9cnico",def:"Fallo muscular: no puedes completar otra repetici\xF3n aunque lo intentes. Fallo t\xE9cnico: a\xFAn podr\xEDas moverla, pero ya no con t\xE9cnica correcta. Para hipertrofia se entrena cerca del fallo; llegar siempre al fallo absoluto aumenta la fatiga m\xE1s que el est\xEDmulo.",ej:"Si en la rep 9 la espalda se despega del respaldo, esa fue tu \xFAltima rep \xFAtil: fallo t\xE9cnico."},{id:"volumen",term:"Volumen de entrenamiento",def:"Cantidad total de trabajo. La forma m\xE1s usada de medirlo es el n\xFAmero de series efectivas por grupo muscular por semana; tambi\xE9n se mide en kilos totales (peso \xD7 reps \xD7 series).",ej:"Espalda: 14 series efectivas/semana. FORJA calcula el tonelaje de cada sesi\xF3n autom\xE1ticamente."},{id:"mev",term:"MEV (Volumen M\xEDnimo Efectivo)",def:"El n\xFAmero de series efectivas por semana, para un grupo muscular, por debajo del cual pr\xE1cticamente no hay progreso: es el m\xEDnimo que hay que hacer para que el m\xFAsculo crezca. Menos que el MEV es \xABbajo\xBB en FORJA.",ej:"Si el MEV de pecho es 8 series/semana, con solo 4 series est\xE1s muy por debajo del est\xEDmulo m\xEDnimo: hay que sumar m\xE1s volumen para progresar."},{id:"mav",term:"MAV (rango de M\xE1xima Adaptaci\xF3n de Volumen)",def:"Rango de series efectivas por semana donde el m\xFAsculo progresa mejor: ya se pas\xF3 el m\xEDnimo (MEV) pero todav\xEDa no se llega al techo recuperable (MRV). Es la \xABzona \xF3ptima\xBB que FORJA destaca en cada tabla de volumen. La mayor parte del entrenamiento deber\xEDa vivir en este rango.",ej:"Si el rango \xF3ptimo de espalda es 14\u201322 series/semana, entrenar con 18 series est\xE1 justo en la zona donde m\xE1s se progresa."},{id:"mrv",term:"MRV (Volumen M\xE1ximo Recuperable)",def:"El techo de series efectivas por semana que el cuerpo puede recuperar en esa fase. Pasarse de este n\xFAmero no da m\xE1s m\xFAsculo: solo suma fatiga que no alcanzas a disipar entre sesiones, y el rendimiento empieza a bajar. Sirve como l\xEDmite superior, no como meta.",ej:"Si el MRV de b\xEDceps es 20 series/semana y programas 26, probablemente est\xE9s sobre-entrenando ese grupo: toca bajar volumen o meter un deload."},{id:"landmarks",term:"MEV / zona \xF3ptima (MAV) / MRV, todos juntos",def:"Son tres marcas en la misma escala de series semanales, de menor a mayor: MEV (m\xEDnimo para estimular) \u2192 zona \xF3ptima o MAV (donde m\xE1s se progresa) \u2192 MRV (techo recuperable). FORJA los muestra en ese orden, separados por \xAB/\xBB: por ejemplo \xAB8 / 12\u201320 / 22\xBB significa MEV 8, zona \xF3ptima entre 12 y 20, MRV 22 series por semana.",ej:"Pecho: 8 / 12\u201320 / 22 \xB7 2\xD7/sem \u2192 con menos de 8 series vas bajo, entre 12 y 20 est\xE1s en la zona ideal, y pasar de 22 es entrenar m\xE1s de lo que puedes recuperar. El \xAB2\xD7/sem\xBB es la frecuencia semanal sugerida para ese grupo."},{id:"sobrecarga",term:"Sobrecarga progresiva",def:"Principio central del progreso: hacer m\xE1s con el tiempo \u2014 m\xE1s peso, m\xE1s repeticiones o m\xE1s series con la misma t\xE9cnica. Por eso registrar cada serie importa: sin historial no hay progresi\xF3n medible.",ej:"Semana 1: 80 kg \xD7 8. Semana 3: 80 kg \xD7 10. Semana 4: 82,5 kg \xD7 8."},{id:"mesociclo",term:"Mesociclo",def:"Bloque de entrenamiento de 4 a 8 semanas con una progresi\xF3n planificada (subiendo volumen o intensidad), que normalmente termina en una descarga.",ej:"Mesociclo de 5 semanas: RIR 3 \u2192 2 \u2192 2 \u2192 1 \u2192 deload."},{id:"cluster",term:"Cluster set (serie en racimo)",def:"Serie partida en mini-bloques con pausas muy cortas dentro de la propia serie, para acumular repeticiones de calidad con una carga alta que en continuo no aguantar\xEDas. La pausa deja recuperar fosfocreatina sin perder la tensi\xF3n del ejercicio.",ej:"Cluster 3/1/1/1 con tu peso de 5RM: 3 reps \u2192 10-15 s de pausa (la barra descansa) \u2192 1 rep \u2192 10-15 s \u2192 1 rep \u2192 10-15 s \u2192 1 rep. Eso es UNA serie: 6 reps con un peso de 5RM. Descanso entre clusters: 3-5 min. \xDAsalo en b\xE1sicos (sentadilla, press, remo), 2-4 clusters por ejercicio."},{id:"vma",term:"Serie de acci\xF3n muscular variable (VMA)",def:"Series de trabajo en las que, nada m\xE1s terminar las repeticiones, mantienes el peso quieto en el punto de mayor tensi\xF3n durante un tiempo fijo. No hay descanso entre la serie y la isometr\xEDa, ni entre los elementos del bloque: combina fase conc\xE9ntrica, exc\xE9ntrica e isom\xE9trica en un solo esfuerzo continuo.",ej:"Curl en polea: 10 reps controladas \u2192 sin soltar, aguantas a 90\xB0 durante 10 s \u2192 reci\xE9n ah\xED descansas 90-120 s. Repite 3 rondas. Como la isometr\xEDa suma mucha fatiga, baja un 10-15 % el peso que usar\xEDas normalmente."},{id:"midiso",term:"Isometr\xEDa en rango medio + repeticiones",def:"Empiezas la serie aguantando el peso en el punto medio del recorrido, que es donde el m\xFAsculo est\xE1 en m\xE1xima tensi\xF3n y donde suele estar el punto de estancamiento. Cuando terminas la pausa, pasas directo a repeticiones completas hasta acabar la serie. Sube el tiempo bajo tensi\xF3n y ataca justo la zona m\xE1s d\xE9bil.",ej:"Press inclinado: aguanta con los codos a 90\xB0 durante 15-20 s \u2192 sin soltar, 8-10 reps completas \u2192 descansa 2-3 min. 3 series. Empieza con un 60-70 % del peso habitual: la isometr\xEDa inicial deja el m\xFAsculo muy fatigado."},{id:"pfi",term:"Isometr\xEDa de pre-fatiga + m\xE1ximas repeticiones",def:"M\xE9todo muy exigente: primero agotas el m\xFAsculo con una isometr\xEDa en rango medio resistiendo el peso todo lo que puedas, hasta que ya no puedes sostener la posici\xF3n; en ese momento pasas de inmediato a repeticiones completas hasta el fallo. La pre-fatiga hace que las repeticiones siguientes sean mucho m\xE1s duras con menos carga.",ej:"Extensi\xF3n de cu\xE1driceps: aguanta a mitad de recorrido hasta que la pierna cede (suele caer entre 20 y 45 s) \u2192 sin soltar, repeticiones completas hasta el fallo (salen 5-10) \u2192 descansa 2-3 min. M\xE1ximo 1-2 series por ejercicio y solo al final de la sesi\xF3n: la fatiga que deja es enorme."},{id:"superserie2",term:"Superserie, triserie y serie gigante",def:"Bloque de 2 (superserie), 3 (triserie) o 4 o m\xE1s ejercicios (serie gigante) que se hacen uno detr\xE1s de otro sin descanso entre ellos. El descanso llega solo al terminar la ronda completa, y el bloque se repite tantas rondas como indique el plan. Ahorra tiempo y sube la densidad DOMINIO T\xC9CNICO QUE MANEJAS
1. Hipertrofia: tensi\xF3n mec\xE1nica como est\xEDmulo principal, series efectivas cerca del fallo (RIR 0-4), rango de 5 a 30 repeticiones \xFAtil si la proximidad al fallo es suficiente, importancia de la tensi\xF3n en posici\xF3n de estiramiento, rango completo y control exc\xE9ntrico.
2. Volumen: MEV, MAV y MRV por grupo muscular; el volumen productivo sube a lo largo del mesociclo y se recorta en el deload. Referencias por semana: ${Object.entries(Js).map(([r,n])=>`${r} ${n.mev}/${n.mav[0]}-${n.mav[1]}/${n.mrv}`).join(", ")} (MEV/MAV/MRV en series efectivas).

4. Progresi\xF3n: sobrecarga progresiva en carga, repeticiones o series, con doble progresi\xF3n como m\xE9todo base; el RIR gu\xEDa la intensidad real.
5. T\xE9cnicas de intensidad: top set + back-off, drop sets, rest-pause, series mioreps, parciales en estiramiento y superseries. Todas suben fatiga por unidad de est\xEDmulo: se dosifican, casi siempre en aislamientos y al final del ejercicio.
6. Periodizaci\xF3n: mesociclos de 4 a 8 semanas con acumulaci\xF3n progresiva y deload; bloques de especializaci\xF3n para puntos d\xE9biles reduciendo el volumen del resto; transici\xF3n ordenada entre volumen, mantenci\xF3n y definici\xF3n.
7. Biomec\xE1nica y selecci\xF3n de ejercicios: curvas de resistencia, \xE1ngulos, torque articular, criterios para elegir entre libre, m\xE1quina o polea, y sustituciones equivalentes cuando hay dolor o falta de material.
8. Nutrici\xF3n de culturismo: ${Kd.map(r=>`${r.label} \u2192 ${r.kcal}, ritmo ${r.rate}, prote\xEDna ${r.prot}`).join(" | ")}. Reparto de comidas, distribuci\xF3n proteica, timing perientrenamiento, refeeds y diet breaks, manejo del hambre y la adherencia.
9. Suplementaci\xF3n por evidencia: creatina monohidrato 3-5 g/d\xEDa, cafe\xEDna 3-6 mg/kg, prote\xEDna en polvo como herramienta, beta-alanina 3-6 g/d\xEDa, citrulina 6-8 g. Evidencia pobre: BCAA con prote\xEDna suficiente, boosters de testosterona, quemadores.
10. Recuperaci\xF3n: sue\xF1o de 7-9 h como variable cr\xEDtica, manejo de estr\xE9s, se\xF1ales de fatiga sist\xE9mica y local, cu\xE1ndo un deload es obligatorio.
11. Competencia: categor\xEDas (${Zd.map(r=>r.label).join(", ")}), timeline de prep de 16 a 24 semanas seg\xFAn punto de partida, control semanal de condici\xF3n, peak week, posing y presentaci\xF3n.
12. Diagn\xF3stico de estancamientos: antes de redise\xF1ar nada, revisar adherencia, energ\xEDa disponible, sue\xF1o, honestidad del RIR, volumen sobre MRV y calidad t\xE9cnica.

L\xCDMITES INNEGOCIABLES
- No indicas, dosificas ni programas esteroides anabolizantes, hormonas, SARMs, diur\xE9ticos ni ninguna sustancia de prescripci\xF3n o dopante. Si te lo piden, dilo con claridad y deriva a un m\xE9dico especializado; puedes hablar de riesgos generales y de la importancia del control m\xE9dico.
- No eres m\xE9dico ni nutricionista cl\xEDnico: ante patolog\xEDa, medicaci\xF3n, embarazo, trastorno de la conducta alimentaria, menores de edad o dolor con se\xF1ales de alarma (dolor nocturno, p\xE9rdida de fuerza, hormigueo, inflamaci\xF3n marcada), deriva al profesional correspondiente.
- No inventas datos del alumno. Si falta informaci\xF3n clave para responder bien, p\xEDdela antes de dar el plan.

C\xD3MO RESPONDES
- Espa\xF1ol de Chile, tono directo de entrenador: sin relleno, sin motivaci\xF3n vac\xEDa.
- Concreto y accionable: n\xFAmeros, series, repeticiones, RIR, gramos, semanas. Nada de "depende" sin una recomendaci\xF3n.
- Cita los datos reales del alumno cuando apoyen tu razonamiento (volumen actual, PRs, tonelaje, peso corporal).
- M\xE1ximo 6 p\xE1rrafos cortos o una lista breve. Si el tema es grande, entrega lo esencial y ofrece profundizar.
- Explica el porqu\xE9 fisiol\xF3gico en una l\xEDnea cuando cambie una decisi\xF3n, no como clase te\xF3rica.

ESPECIALIDAD ACTIVA EN ESTA CONSULTA: ${a.label}. ${a.focus}

ACCIONES QUE PUEDES EJECUTAR

\`\`\`forja-rutina
{"titulo":"Nombre corto del bloque","days":[{"name":"Empujes 1","exs":[{"name":"Press inclinado con mancuernas","muscle":"Pecho","rest":120,"notes":"Indicaci\xF3n t\xE9cnica breve","sets":[{"type":"normal","repsT":"6-10","rirT":"1"},{"type":"normal","repsT":"10-12","rirT":"0"}]}]}]}

Cuando el coach te pida agregar un ejercicio a la biblioteca (cat\xE1logo reutilizable, aparte de la rutina), o cuando t\xFA mismo recomiendes uno nuevo y el coach lo acepte, incluye:
