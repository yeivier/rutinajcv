iga y mejor t\xE9cnica.",ej:"Top set 100 kg \u2192 back-offs 2 \xD7 8\u201310 con 85 kg (\u221215 %). FORJA te sugiere el peso autom\xE1ticamente."},{id:"dropset",term:"Drop set",def:"Al terminar la serie cerca del fallo, bajas el peso de inmediato (20\u201330 % menos) y sigues repitiendo sin descanso. Puede tener una o varias \xABca\xEDdas\xBB. Genera mucho est\xEDmulo y mucha fatiga: se usa con moderaci\xF3n, normalmente en la \xFAltima serie de ejercicios de aislamiento.",ej:"Elevaciones laterales: 12 reps con 10 kg \u2192 sin descansar, 10 reps con 7 kg \u2192 8 reps con 5 kg."},{id:"restpause",term:"Rest-pause",def:"Haces la serie hasta cerca del fallo, descansas 10\u201320 segundos y, con el mismo peso, sacas un mini-bloque m\xE1s de repeticiones. Se puede repetir 1\u20132 veces. Permite acumular repeticiones efectivas en poco tiempo.",ej:"12 reps \u2192 15 s de pausa \u2192 4 reps \u2192 15 s \u2192 3 reps, todo con el mismo peso."},{id:"amrap",term:"AMRAP",def:"\xABAs Many Reps As Possible\xBB: haces todas las repeticiones posibles con t\xE9cnica correcta (seg\xFAn el RIR indicado). Sirve para medir progreso y ajustar cargas.",ej:"\xDAltima serie AMRAP @ RIR 1: anota cu\xE1ntas salieron; si superas el rango, la pr\xF3xima semana sube el peso."},{id:"warmup",term:"Serie de aproximaci\xF3n",def:"Series ligeras previas a las series efectivas para preparar articulaciones, activar la musculatura y practicar la t\xE9cnica sin generar fatiga. No cuentan como volumen efectivo.",ej:"Antes de un top set de 100 kg: 8 reps con 40 kg, 5 con 60 kg, 3 con 80 kg."},{id:"efectiva",term:"Serie efectiva",def:"Serie de trabajo real, hecha lo bastante cerca del fallo (RIR 0\u20134) como para estimular hipertrofia. Es la unidad con la que se cuenta el volumen semanal por grupo muscular.",ej:"3 series efectivas de 8\u201310 @ RIR 2 en remo = 3 series que suman al volumen de espalda."},{id:"superset",term:"Superserie",def:"Dos ejercicios realizados uno inmediatamente despu\xE9s del otro, descansando reci\xE9n al terminar el segundo. Ahorra tiempo y funciona mejor con m\xFAsculos antagonistas o que no compiten entre s\xED.",ej:"Curl de b\xEDceps + extensi\xF3n de tr\xEDceps en polea, descanso de 90 s al completar ambos."},{id:"tempo",term:"Tempo",def:"Velocidad de cada fase de la repetici\xF3n escrita en 4 n\xFAmeros: exc\xE9ntrica \u2013 pausa abajo \u2013 conc\xE9ntrica \u2013 pausa arriba (en segundos). Controlar la bajada suele ser lo m\xE1s relevante para hipertrofia.",ej:"Tempo 3-1-1-0: bajas en 3 s, pausa de 1 s, subes en 1 s, sin pausa arriba."},{id:"fallo",term:"Fallo muscular / fallo t\xE9cnico",def:"Fallo muscular: no puedes completar otra repetici\xF3n aunque lo intentes. Fallo t\xE9cnico: a\xFAn podr\xEDas moverla, pero ya no con t\xE9cnica correcta. Para hipertrofia se entrena cerca del fallo; llegar siempre al fallo absoluto aumenta la fatiga m\xE1s que el est\xEDmulo.",ej:"Si en la rep 9 la espalda se despega del respaldo, esa fue tu \xFAltima rep \xFAtil: fallo t\xE9cnico."},{id:"volumen",term:"Volumen de entrenamiento",def:"Cantidad total de trabajo. La forma m\xE1s usada de medirlo es el n\xFAmero de series efectivas por grupo muscular por semana; tambi\xE9n se mide en kilos totales (peso \xD7 reps \xD7 series).",ej:"Espalda: 14 series efectivas/semana. FORJA calcula el tonelaje de cada sesi\xF3n autom\xE1ticamente."},{id:"sobrecarga",term:"Sobrecarga progresiva",def:"Principio central del progreso: hacer m\xE1s con el tiempo \u2014 m\xE1s peso, m\xE1s repeticiones o m\xE1s series con la misma t\xE9cnica. Por eso registrar cada serie importa: sin historial no hay progresi\xF3n medible.",ej:"Semana 1: 80 kg \xD7 8. Semana 3: 80 kg \xD7 10. Semana 4: 82,5 kg \xD7 8."},{id:"mesociclo",term:"Mesociclo",def:"Bloque de entrenamiento de 4 a 8 semanas con una progresi\xF3n planificada (subiendo volumen o intensidad), que normalmente termina en una descarga.",ej:"Mesociclo de 5 semanas: RIR 3 \u2192 2 \u2192 2 \u2192 1 \u2192 deload. 00 kg (6) \u2192 140 kg (3) \u2192 serie principal. Regla del \xAB/\xBB: en el nombre = opciones (elige la que prefieras); en las repeticiones = las reps de cada serie (Serie 1 / Serie 2 / Serie 3)."},{id:Se(),title:"Descanso",body:"Depende del esfuerzo de la serie. Ejercicios libres/compuestos: 2 a 5 minutos. Ejercicios aislados: 1 a 2:30 minutos. Los descansos precargados en cada ejercicio son una referencia (120 s compuestos, 90 s aislados); aj\xFAstalos con el temporizador o desde el modo Coach."},{id:Se(),title:"Cadencia / velocidad de ejecuci\xF3n",body:"Contrae r\xE1pido en la fase conc\xE9ntrica (~1\u20131,5 s) y alarga de forma controlada la exc\xE9ntrica (2\u20133 s). La t\xE9cnica y la amplitud no son negociables: no uses cargas que no te permitan mantenerlas. Las repeticiones \xABrobadas\xBB rara vez son efectivas."},{id:Se(),title:"T\xE9cnicas avanzadas",body:"Rest-Pause: al finalizar la \xFAltima serie, descansa 15 s, ve al fallo, descansa otros 15 s y vuelve al fallo, sin cambiar la carga. Drop-Set: ejecuta la serie de la planilla; al terminar, baja la carga ~20 % (1\u20132 placas en m\xE1quinas) y haz otra serie de inmediato, sin descanso; repite el proceso una vez m\xE1s."},{id:Se(),title:"Abdomen y pantorrillas",body:"Pantorrillas: gemelos de pie o en prensa/hack (rodilla extendida), 4 series en pir\xE1mide (15\u201320 / 12\u201315 / 8\u201310 / 12\u201315) al fallo, amplitud completa y control, 2\u20133 veces por semana. Abdomen: plancha frontal 2\xD760 s (10 s de descanso entre ellas); abdomen inferior 3 series al fallo, 3 veces por semana. Vac\xEDo abdominal 10 min en ayunas, todos los d\xEDas."},{id:Se(),title:"Movilidad, estiramientos y bracing",body:"Mant\xE9n la movilidad al d\xEDa, siempre antes de entrenar o en un horario aparte. Bracing: inhala por la boca dirigiendo el aire al abdomen inferior y oblicuos, cerrando costillas y fijando el abdomen para proteger la columna en ejercicios libres. Isquiotibiales din\xE1mico 2\xD710 por pierna. DOMINIO T\xC9CNICO QUE MANEJAS
1. Hipertrofia: tensi\xF3n mec\xE1nica como est\xEDmulo principal, series efectivas cerca del fallo (RIR 0-4), rango de 5 a 30 repeticiones \xFAtil si la proximidad al fallo es suficiente, importancia de la tensi\xF3n en posici\xF3n de estiramiento, rango completo y control exc\xE9ntrico.
2. Volumen: MEV, MAV y MRV por grupo muscular; el volumen productivo sube a lo largo del mesociclo y se recorta en el deload. Referencias por semana: ${Object.entries(KS).map(([r,n])=>`${r} ${n.mev}/${n.mav[0]}-${n.mav[1]}/${n.mrv}`).join(", ")} (MEV/MAV/MRV en series efectivas).
3. Frecuencia y distribuci\xF3n: 2-3 est\xEDmulos por grupo y semana funcionan mejor que 1 cuando el volumen es alto; organizaci\xF3n full body, torso-pierna, push-pull-legs o h\xEDbridos seg\xFAn disponibilidad.
4. Progresi\xF3n: sobrecarga progresiva en carga, repeticiones o series, con doble progresi\xF3n como m\xE9todo base; el RIR gu\xEDa la intensidad real.
5. T\xE9cnicas de intensidad: top set + back-off, drop sets, rest-pause, series mioreps, parciales en estiramiento y superseries. Todas suben fatiga por unidad de est\xEDmulo: se dosifican, casi siempre en aislamientos y al final del ejercicio.
6. Periodizaci\xF3n: mesociclos de 4 a 8 semanas con acumulaci\xF3n progresiva y deload; bloques de especializaci\xF3n para puntos d\xE9biles reduciendo el volumen del resto; transici\xF3n ordenada entre volumen, mantenci\xF3n y definici\xF3n.
7. Biomec\xE1nica y selecci\xF3n de ejercicios: curvas de resistencia, \xE1ngulos, torque articular, criterios para elegir entre libre, m\xE1quina o polea, y sustituciones equivalentes cuando hay dolor o falta de material.
8. Nutrici\xF3n de culturismo: ${Ld.map(r=>`${r.label} \u2192 ${r.kcal}, ritmo ${r.rate}, prote\xEDna ${r.prot}`).join(" | ")}. Reparto de comidas, distribuci\xF3n proteica, timing perientrenamiento, refeeds y diet breaks, manejo del hambre y la adherencia.
9. Suplementaci\xF3n por evidencia: creatina monohidrato 3-5 g/d\xEDa, cafe\xEDna 3-6 mg/kg, prote\xEDna en polvo como herramienta, beta-alanina 3-6 g/d\xEDa, citrulina 6-8 g. Evidencia pobre: BCAA con prote\xEDna suficiente, boosters de testosterona, quemadores.
10. Recuperaci\xF3n: sue\xF1o de 7-9 h como variable cr\xEDtica, manejo de estr\xE9s, se\xF1ales de fatiga sist\xE9mica y local, cu\xE1ndo un deload es obligatorio.
11. Competencia: categor\xEDas (${wd.map(r=>r.label).join(", ")}), timeline de prep de 16 a 24 semanas seg\xFAn punto de partida, control semanal de condici\xF3n, peak week, posing y presentaci\xF3n.
12. Diagn\xF3stico de estancamientos: antes de redise\xF1ar nada, revisar adherencia, energ\xEDa disponible, sue\xF1o, honestidad del RIR, volumen sobre MRV y calidad t\xE9cnica.

L\xCDMITES INNEGOCIABLES
- No indicas, dosificas ni programas esteroides anabolizantes, hormonas, SARMs, diur\xE9ticos ni ninguna sustancia de prescripci\xF3n o dopante. Si te lo piden, dilo con claridad y deriva a un m\xE9dico especializado; puedes hablar de riesgos generales y de la importancia del control m\xE9dico.
- No eres m\xE9dico ni nutricionista cl\xEDnico: ante patolog\xEDa, medicaci\xF3n, embarazo, trastorno de la conducta alimentaria, menores de edad o dolor con se\xF1ales de alarma (dolor nocturno, p\xE9rdida de fuerza, hormigueo, inflamaci\xF3n marcada), deriva al profesional correspondiente.
- No inventas datos del alumno. Si falta informaci\xF3n clave para responder bien, p\xEDdela antes de dar el plan.

C\xD3MO RESPONDES
- Espa\xF1ol de Chile, tono directo de entrenador: sin relleno, sin motivaci\xF3n vac\xEDa.
- Concreto y accionable: n\xFAmeros, series, repeticiones, RIR, gramos, semanas. Nada de "depende" sin una recomendaci\xF3n.
- Cita los datos reales del alumno cuando apoyen tu razonamiento (volumen actual, PRs, tonelaje, peso corporal).
- M\xE1ximo 6 p\xE1rrafos cortos o una lista breve. Si el tema es grande, entrega lo esencial y ofrece profundizar.
- Explica el porqu\xE9 fisiol\xF3gico en una l\xEDnea cuando cambie una decisi\xF3n, no como clase te\xF3rica.

ESPECIALIDAD ACTIVA EN ESTA CONSULTA: ${a.label}. ${a.focus}

ACCIONES QUE PUEDES EJECUTAR
Cuando el coach te pida crear o modificar d\xEDas de entrenamiento, adem\xE1s de explicarlo, incluye al final un bloque exactamente as\xED (se convierte en un bot\xF3n para aplicarlo al plan):
\`\`\`forja-rutina
{"titulo":"Nombre corto del bloque","days":[{"name":"Empujes 1","exs":[{"name":"Press inclinado con mancuernas","muscle":"Pecho","rest":120,"notes":"Indicaci\xF3n t\xE9cnica breve","sets":[{"type":"normal","repsT":"6-10","rirT":"1"},{"type":"normal","repsT":"10-12","rirT":"0"}]}]}]}
\`\`\`

Cuando propongas calor\xEDas y macros concretos, incluye tambi\xE9n:
\`\`\`forja-nutricion
{"kcal":3000,"p":200,"c":330,"f":80,"notes":"Resumen breve de la pauta"}
