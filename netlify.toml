[build]
  command = "node scripts/gen-config.js"
  publish = "."

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El HTML nunca se cachea: así el navegador siempre pide la versión actual
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# config.js dice a qué base apunta el sitio: nunca se cachea, o un
# despliegue que cambie de base seguiría escribiendo en la vieja.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# El contenido de bundle.js es inmutable para un ?v= dado (cada release
# cambia el número), así que esta versión concreta se puede cachear a largo
# plazo sin round-trip de revalidación: index.html (que nunca se cachea)
# siempre apunta al ?v= correcto, así que nunca sirve un bundle viejo.
[[headers]]
  for = "/bundle.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El catálogo de ejercicios: mismo trato que bundle.js. Se pide con ?v= y
# su contenido no cambia para un ?v= dado, así que se cachea a largo plazo
# — son ~890 KB (unos 114 KB comprimidos) que conviene bajar UNA vez.
[[headers]]
  for = "/catalogo-ejercicios.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El service worker siempre se revalida: si quedara cacheado viejo, una
# actualización de la app podría no llegar a instalarse nunca.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# v206: el bundle se parte en trozos (chunk-<hash>.js). El hash cambia con
# el contenido, así que cada archivo es inmutable por definición.
[[headers]]
  for = "/chunk-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
