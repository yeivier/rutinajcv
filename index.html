<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script>
    // Extractor de emergencia: si un service worker VIEJO (de antes de
    // este sistema de versiones, o de un navegador embebido que revisa
    // actualizaciones más lento — el de WhatsApp/Instagram, por ejemplo)
    // sigue controlando esta pestaña, esperar a que se entere SOLO de que
    // hay una versión nueva puede tardar minutos, horas, o no pasar nunca
    // — le pasó a una alumna, que seguía viendo la pantalla de antes del
    // login mucho después del cambio. Esta bandera (independiente del
    // ?v= de bundle.js, que index.html ya revisa siempre porque nunca se
    // cachea) fuerza, apenas detecta que cambió, borrar TODO lo que
    // pudiera estar sirviendo una copia vieja —cualquier service worker
    // registrado y toda la Cache Storage— y recargar UNA vez, sin
    // depender de que el service worker viejo coopere: unregister() y
    // caches.delete() actúan directo, no esperan su ciclo propio.
    (function () {
      try {
        var V = "238";
        var visto = window.localStorage.getItem("forja-shell-v");
        if (visto === V) return; // ya está al día, nada que limpiar
        window.localStorage.setItem("forja-shell-v", V);
        var teniaAlgo = false;
        var pendientes = [];
        if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
          pendientes.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            if (rs.length) teniaAlgo = true;
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }).catch(function () {}));
        }
        if (window.caches && caches.keys) {
          pendientes.push(caches.keys().then(function (ks) {
            if (ks.length) teniaAlgo = true;
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }).catch(function () {}));
        }
        // Solo recarga si YA había algo que limpiar (un service worker o
        // una caché de una visita anterior) — la primera vez de un
        // navegador nuevo no tiene nada viejo que sacarse de encima.
        if (visto != null) {
          Promise.all(pendientes).then(function () {
            if (teniaAlgo) window.location.reload();
          });
        }
      } catch (e) {}
    })();
  </script>

  <!-- v204: se revierte la decisión de "cero fuentes web" de más arriba.
       El usuario probó el rediseño y, con razón, dijo que se veía igual
       que antes — y tenía razón: toda la app corría con la tipografía del
       sistema (SF Pro), la misma de siempre, así que ningún cambio de
       mayúsculas o de chips se notaba de un vistazo. Inter es lo que
       recibe cualquiera que no tenga la fuente, así que la mitigación es
       la propia carga: font-display:swap pinta con la tipografía del
       sistema al instante y cambia a Inter si llega a tiempo — nunca hay
       texto invisible ni bloqueo, y si la red del gimnasio falla, se ve
       exactamente como se veía antes (mismo fallback de siempre en el
       CSS). Con caché de navegador, después de la primera vez es
       instantánea igual. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- v206: la hoja de estilos de Google Fonts bloqueaba el primer pintado
       (el navegador no dibuja nada hasta tenerla). Se pide como preload y
       se activa al llegar: la app aparece al instante con la fuente del
       sistema y cambia a Inter en cuanto llega (font-display: swap). -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />

<body>
  <div id="root"></div>
  <!-- A qué base apunta ESTE sitio. Lo genera scripts/gen-config.js en
       cada despliegue desde variables de entorno; si no existe, el bundle
       usa su base por defecto. Va antes del bundle: los dos con defer,
       que conserva el orden. -->
  <script src="/config.js" defer></script>
  <!-- v206: type="module" para poder partir el bundle en trozos (recharts,
       ~320 KB, ahora va aparte y solo se baja al abrir un gráfico). Un
       módulo se ejecuta como defer y respeta el orden con config.js. -->
  <script type="module" src="/bundle.js?v=242"></script>
  <script>
    // Registra el service worker que permite abrir la app sin internet
    // (sirve la última copia guardada de index.html/bundle.js cuando no
    // hay red). No es soporte de todos los navegadores, así que se
    // registra en silencio: si falla o no existe, la app sigue andando
    // igual, solo sin esta capa extra.
    if ("serviceWorker" in navigator) {
      // Si ya había un service worker controlando esta pestaña y aparece
      // uno nuevo (una versión nueva desplegada), este cambio de "dueño"
      // significa que la copia vieja del shell quedó atrás: se recarga UNA
      // vez para que la app se pinte con el código nuevo al instante, sin
      // que el usuario tenga que forzar recarga. El guard `controller` evita
      // recargar en la primera visita (cuando aún no había ninguno), y la
      // bandera evita cualquier bucle de recargas.
      if (navigator.serviceWorker.controller) {
        let recargando = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (recargando) return;
          recargando = true;
          window.location.reload();
        });
      }
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").then((reg) => {
          // Empuja una comprobación de actualización apenas carga, para no
          // esperar al chequeo automático del navegador (que puede tardar).
          try { reg.update(); } catch (e) {}
        }).catch(() => {});
      });
    }
  </script>
</body>
